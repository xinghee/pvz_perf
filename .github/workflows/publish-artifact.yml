name: Publish built package to a release

# Moves an already-built artifact onto a GitHub Release from the runner, so a
# slow local link to GitHub is not in the path. No compilation happens here.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id that owns the artifact'
        required: true
        type: string
      release_tag:
        description: 'Release tag (defaults to zh-preview)'
        type: string
        default: ''
      artifact_name:
        description: 'Artifact name'
        type: string
        default: pvz_perf-pc-win64-vulkan

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.release_tag }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Fetch the built artifact from the build run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pkg

      - name: Show what was fetched
        run: |
          ls -la pkg
          find pkg -maxdepth 2 -type f -printf '%p %s\n' | head

      - name: Create the release if needed, then upload
        run: |
          set -euo pipefail
          tag="${TAG:-zh-preview}"
          zip="$(find pkg -name '*.zip' -type f | head -1)"
          if [ -z "$zip" ]; then
            echo "no zip inside the artifact" >&2
            exit 1
          fi
          name="$(basename "$zip")"

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_TOKEN}"

          rel=$(curl -s -H "$auth" -H "Accept: application/vnd.github+json" "${api}/releases/tags/${tag}" || true)
          rid=$(printf '%s' "$rel" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)

          if [ -z "$rid" ]; then
            rid=$(curl -s -X POST -H "$auth" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" "${api}/releases" \
              -d "{\"tag_name\":\"${tag}\",\"name\":\"pvz_perf ${tag}\",\"target_commitish\":\"${GITHUB_SHA}\",\"body\":\"Automated build artifact. Extract over an existing install; keep your bass.dll, effects/ and data/.\"}" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
            echo "created release ${tag} (${rid})"
          else
            echo "reusing release ${tag} (${rid})"
          fi

          existing=$(curl -s -H "$auth" -H "Accept: application/vnd.github+json" "${api}/releases/${rid}/assets" \
            | python3 -c "import json,sys;n=sys.argv[1];print(next((a['id'] for a in json.load(sys.stdin) if a['name']==n),''))" "$name")
          if [ -n "$existing" ]; then
            curl -s -X DELETE -H "$auth" -H "Accept: application/vnd.github+json" "${api}/releases/assets/${existing}"
            echo "removed previous asset ${existing}"
          fi

          curl -s -X POST -H "$auth" -H "Content-Type: application/zip" \
            --data-binary "@${zip}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=${name}" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('uploaded', d.get('name'), d.get('size'), d.get('browser_download_url'))"

          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
